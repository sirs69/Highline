de","Tap a framed floor. Cabinets and prizes: cheap fun that draws crowds"],["school","School","Tap a framed floor. Families in condos pay tuition and like living near it"],["maint","Maintenance shop","Tap a framed floor. Two technicians fix damaged rooms, elevator outages and roaches for parts only"],["gen","Backup generator","Tap a framed basement floor. Keeps elevators, pumps and cooling running through a blackout"],["fine","Fine restaurant","Tap a framed floor. Fewer seats, pricier meals. Needs a 3-star tower"],["food","Fast food","Tap a framed floor. Low floors get street customers"],["cinema","Theater","Two floors tall, 14 bays wide: needs both floors framed. Shows from matinee to late show; a new movie opens every Friday"],["sec","Security","Tap a framed floor or basement. Guards watch the cameras, patrol, quiet parties and handle odd guests"],["med","Medical","Tap a framed floor. Tenants and walk-ins come in for checkups and the clinic bills them; a 4-star tower needs one"],["obs","Obs. deck","One of the top three floors. Visitors pay for the view; the higher it is and the clearer the day, the more tickets"],null,["spire","Spire","Roof: tap just above the top floor. A steel spire with an aircraft warning light; counts toward height to the tip"],["deco","Deco crown","Roof. Three tiers of Art Deco arches, lit at night"],["mast","Mast","Roof. A broadcast antenna; carriers lease it for $30k a month"],["heli","Helipad","Roof. Executive helicopters land by day and pay a fee"],["garden","Roof garden","Roof. Trees and planters; the floors just below like the view"],null,["park","Parking","Basements only: 5 spaces. Drag for a row. Condo residents park free; others pay"],["ramp","Ramp","Basements only. Climbs to the level above; on B1 it opens to the street"],["wash","Car wash","Basement. Full-service wash and detail for parkers, $45"],["trash","Trash room","Basement. Chutes from every floor fill it; a hauler swaps the container every Monday. Each room holds about 8 tons"],["valet","Valet","Tap the street lobby. Valets park cars for a $20 premium"],null,["stairs","Stairs","Tap a floor: stairs climb to the floor above. Drag up for a stack. Rooms can sit behind them"],["esc","Escalator","Premium stairs: a 12-second ride people prefer. Only within 4 floors above a lobby"],["std","Elevator","Press on the bottom floor and drag up to the top floor (50 max). Drag from an existing shaft to extend it. Each car adds its own hoistway"],["exp","Express","Drag from floor 1 up to a sky lobby, up to 150 floors. Stops only at lobbies"],["svc","Service","Drag from bottom to top floor. Housekeepers only"],["damper","Damper","Tuned mass damper: a 660-ton steel pendulum that swings against the wind and cuts sway up to 40%. Tap a floor in the top quarter of the tower"],["tankS","Tank S","Green spots fit it; red floors have no water. 2,500 gal, pump 600 gpm, feeds the 30 floors below"],["tankM","Tank M","Green spots fit it; red floors have no water. 8,000 gal, pump 1,500 gpm, feeds the 30 floors below"],["tankL","Tank L","Green spots fit it; red floors have no water. 20,000 gal, pump 3,500 gpm, feeds the 30 floors below"],["coolS","Chiller S","Green roof spots fit it; hot rooms glow red. 300 tons"],["coolM","Chiller M","Green roof spots fit it; hot rooms glow red. 800 tons"],["coolL","Chiller L","Green roof spots fit it; hot rooms glow red. 2,000 tons"],null,["bridge","Sky bridge","Drag from one tower across a gap to another on the same floor: a glass walkway that links them"],["restroom","Restrooms","A 3-bay pair of restrooms: offices, shops and restaurants on this floor and the next are happier"],["apt","Apartment","A 12-bay rental for 2: monthly rent instead of a sale"],["party","Party hall","20 bays. Parties on Friday and Saturday nights, business lunches some weekdays. Loud for the neighbors"],["recycle","Recycling","Basement. Sorts paper, glass and cans out of the trash: less to haul, a little to sell. Needed for 4 stars"],["metro","Metro station","30 bays on the lowest basement. Trains every 2 minutes bring shoppers and diners; needed for the TOWER rating"],["board","Billboard","On a roof. Leases monthly to advertisers; higher roofs earn more"],["cathedral","Cathedral","The landmark, on the highest roof. Weddings on Saturdays; needed for the TOWER rating"],["spr","Sprinklers","Drag up across floors to fit sprinklers. They put out fires early, fed by city pressure or a roof tank"],null,["you","You","Tap anywhere: you walk or ride there. Your panel lists what you can do"],["remove","Remove","Tap rooms or shafts to select them (tap again to unselect), then confirm. Drag across empty floor to remove the frame"]],yn=[0,1,20,240,1200],Y2=["\u275A\u275A","\u25B6","\u25B6\u25B6","\u25B6\u25B6\u25B6","\u25B6\u25B6\u25B6\u25B6"],Ur=[["v1.077",`If you are still having SAVE issues then please report bug. Ty!
\u2022 Every 7 game days a Save file button appears. Tap it to download your tower, so a lost browser save can be restored with Import save file.`],["v1.076",`If you are still having SAVE issues then please report bug. Ty!
\u2022 Top speed is about two-thirds slower.
\u2022 Fire alarms from pranks and faulty detectors are less frequent.
\u2022 Speed is smoother on slower devices: the game no longer freezes and then jumps ahead.`],["v1.075",`If you are still having SAVE issues then please report bug. Ty!
\u2022 Report a bug is in the Menu, in red, and needs a short note before it sends.
\u2022 Warning messages stay on screen for 9 seconds, whatever the speed.
\u2022 Temperature can show in \xB0F or \xB0C from the Menu.
\u2022 Bank credit starts at $10M. Automatic loans are $2M at a time, and new borrowing costs 2% a month. Your starting loan stays at 0.6%.
\u2022 A warning shows when bank credit runs low.
\u2022 Upkeep is cheaper: $20 per floor slab instead of $60.
\u2022 Saves from earlier versions carry over.`],["v1.074",`\u2022 Rooms you can't rent now say why: No elevator or No water.
\u2022 A tip appears when every room is leased and you can afford to grow.
\u2022 Serial killer mystery: a Case board under You shows who was at every scene. Tip off the right person for a $50k reward.
\u2022 Tenants only start killing once your tower is established.
\u2022 Bad-trip tenants shake up the neighbors.
\u2022 Clearer message when you build outside the framed floors.
\u2022 Save problems? Please click Report a bug.`],["v1.073",`\u2022 Murder, affairs, feuds and betrayal in the tower.
\u2022 Follow cases under You. Tip off the police or frame someone.
\u2022 You can kill too. Get caught and it's game over.
\u2022 Faster start: no site screen, and it fast-forwards to your first tenants.
\u2022 Tenants pay their first month when they sign.
\u2022 Cash shows last month's net.`],["v1.072","You can now play offline: tap Play offline on the title screen or in the Menu to download the whole game as one file. The bank can now take your tower: if you are in the red with no credit left for 30 days, it forecloses, with warnings at 5 days and 1 day left. Getting back above zero cancels it. The title screen no longer has lightning."],["v1.071","Loans are easy now: every new tower starts with a bank loan, and Finances has Borrow $1M, $5M and $25M plus Repay $1M, $5M and all. If your cash runs out the bank lends you what you need. The Remove tool can now pick a room behind stairs or an elevator: tap once for the stairs, again for the room. Starting cash is lower to match the cheaper buildings, condos sell for 20% less and property tax is a bit higher. Thunder no longer plays on the title screen."],["v1.070","Report bug is now a button at the bottom right of the main screen. Tap it, add an optional note, then tap Send report. Reports can be sent once every 10 seconds. The big demo tower has a more realistic elevator layout: banks meet at the sky lobbies, so riders no longer get off to wait for another elevator at an odd floor. When an elevator keeps people waiting too long, the game now tells you which one and what to do. Your saves are now also backed up to your account, so a new version never loses them. A short news brief pops up when you start playing."],["v1.069","The 200-floor demo tower has its full set of elevators back, so offices stay happy. Saving no longer slows the game down. The title tower starts with people already at their desks."],["v1.068","Disasters hit much harder. Fires come in four degrees, from a small blaze to a kitchen grease fire, and kitchens burn worst. Sprinklers still save a building but the water now ruins rooms and you pay for cleanup and the fire response. Tornados, earthquakes, hurricanes and floods damage more rooms. Digging deeper basements gives the tower deeper footings, which cuts earthquake damage by up to 70%. Stairs can no longer be built side by side. Building prices are 40% lower. Water use is now realistic, with much higher peak flows, stronger pumps and more tanks in the big demo towers. Taps register more reliably and show a ring where you tapped. A new Report a bug button in the menu sends a report to the developer in two taps, with an optional note."],["v1.067","Fast food has real employees: up to 8 per restaurant, working shifts, taking days off, quitting and moving between restaurants. Cranes now pick up beams and crates and carry them to the floors being built. The metro train now moves: one every 10 minutes from 5:00 to 1:00, none overnight. Restrooms are only visited now and then instead of always having someone in them. Saves are also kept in backup storage and recovered automatically if the browser loses them, and autosave now keeps six backups. The Water line now says how far away the nearest tank is. Restaurants no longer say For lease."],["v1.066","Rooms and condos can now be built over an elevator shaft, and shafts can pass through rooms. Tap stairs or an elevator once to select it, tap again to select the room behind. The title screen scrolls faster with people visible. Tap the sway reading in the top bar to learn what mg means. Lightning now has thunder. Idle elevators spread out right away. Construction shows 99% until a room actually opens. Cranes now move."],["v1.065","The title screen is a live tower with people walking around, and it loads much faster."],["v1.064","Autosave keeps your last three towers as backups. Clouds and animations freeze when you pause. Tank cranes no longer cause a cascade of problems, and condo buyback is capped at three a day."],["v1.063","Plan mode: tap Plan to design future floors, rooms and elevators without spending money, then build the plan for real. Escalators can be built in the basement. Rooms no longer blink when you zoom in, restaurants no longer hold more people than they have seats, and the Security office panel reads clearly."],["v1.062","In Remove, tap several rooms to select them, then confirm once. Removing a room, elevator or floor now refunds its price: all of it while it is still being built, 75% once it is finished. Everything builds twice as fast."],["v1.061","Landlord pricing: tap any office, shop, apartment, condo or hotel room and pick a price from a simple dropdown, 70% to 150% of standard. Cheaper fills faster; above 110% tenants and guests get unhappy, and above 130% rooms struggle to fill."],["v1.060","Elevator shafts must keep 4 empty bays between them,. Express elevators now run up to 150 floors at 20 m/s (a real-world long run)."],["v1.059","Elevator shafts must keep one empty bay between them."],["v1.058","Fixed streaky, blocky lines down the left side of the ground on iPad and iPhone Safari."],["v1.057","Renamed Highline Tycoon (your saves carry over)."],["v1.056","Cleanup for release: no outside game names in the help or changelog, film ratings now read ALL, 8+, 13+ and 17+, the five food-court brands and a few company-name words are replaced with original ones, and Credits says every company, person, film and place is fictional."],["v1.055","Sound: the ambience is quieter. The crowd murmur, room tone and city rumble are turned down."],["v1.054","New: Maintenance shop (half-size room, two technicians who fix damaged rooms for parts only, shorten elevator outages and clear roaches). Emergency lighting: in a blackout without a generator, battery lamps and EXIT signs glow for 90 minutes. Your chosen name floats over you. Traffic fix: cars no longer wait on oncoming cars."],["v1.052","New: name yourself (You panel, Change name). Six manual save slots in the menu and the title Load screen; autosave never touches them. New buildings: Fine restaurant, Arcade, School (families in condos pay tuition and like living near it) and a Backup generator that keeps elevators, pumps and cooling running through a blackout. Theaters now play five-act films with their own story lines per genre, subtitles and act grading. More car ramps in the max tower, and cars keep a following gap. Sprinkler heads no longer slide while you pan."],["v1.051","Sound: the building and street ambience no longer uses synthesized voices \u2014 the crowd murmur that could sound like garbled speech is gone, replaced by a warm, wordless room-and-street wash. The random chatter voices are off. Real effects, music, laughter, elevators and weather are unchanged."],["v1.050","Attention overlays: rooms that need you now wear a badge in the cutaway view \u2014 Roaches, Needs cleaning (a hotel room waiting on housekeeping), Unhappy (a tenant about to leave), and For lease / For sale / For rent on empty units. A \u26A0 button in the top bar toggles them and shows how many rooms want attention."],["v1.049","Easier building: tap or drag a little off a spot that does not work and the tool snaps to the nearest one that does, up to a few floors and bays away. A lobby placed near the ground lands on the street floor, a room dropped above the roof lands on the top floor, and a small wobble while dragging no longer spills onto an extra floor."],["v1.048","Big towers load in a blink and run about twice as fast: routes are shared by everyone heading between the same parts of two floors, reachability is worked out once per floor, and saves are about half the size. Elevators work as a group: a crowd waiting at one floor now gets every free car in the shaft instead of one, and on weekday mornings idle cars wait at the lobby for the rush. Wind sway is more realistic: setbacks that narrow the upper floors cut sway by up to 36%, and motion past the comfort limit makes tenants less happy in proportion instead of driving everyone to zero. The title screen shows the copyright."],["v1.047","Graphics: shaded clouds in two layers that take the colour of sunrise and sunset, wispy cirrus, a real moon with phases, more stars and the Milky Way at the island and the falls, city sky-glow, shooting stars, airliners with contrails and night lights, lightning in summer storms, rainbows after rain and in the falls mist, sun glitter on the sea. A deeper skyline with haze, lit window grids, roof water tanks and crown lights. Textured soil, clay, gravel and rock underground. Pavers, asphalt, crosswalks, manholes, and wet streets that reflect the lights with puddles rippling in the rain. Shaded cars with headlight beams, lamps that throw light, fuller trees that sway. The cutaway shows the outer walls, roof parapets, retaining walls and foundation; elevators show machine rooms, ropes and counterweights. Night bloom on the outside view, lens flare, fire glow at night, a new title screen, a skyline that stays distant when you zoom in, and sharp lobbies and shop strips at any zoom. Quality steps down on its own if frames run long."],["v1.046","Five building sites, opened one at a time at 4 stars: Downtown, an island resort, a waterfall gorge, a business capital and a dig to B30 under the city, each with its own scenery, limits, rents and weather. New: recycling centers (needed for 4 stars), a metro station, party halls, a rooftop cathedral and the TOWER rating, billboards, restrooms, rental apartments, sky bridges between towers, bomb threats, gold in the dig, roaches in neglected hotel rooms and Santa on December nights. Also includes v1.045: the star ladder."],["v1.045","A star ladder: you start at 1 star on an 80-bay lot with 20 floors, and each star opens more rooms, taller floors, deeper basements and a wider lot, up to 300 floors and 400 bays at 5 stars."],["v1.044","The build window is in categories: tap one, then the room. Shops: press and drag to any width for a strip of storefronts that lease, pay rent per bay and sell to the floor. Escalators: a premium 12-second ride, allowed within 4 floors above a lobby. Rooms can now sit behind stairs and escalators. Towers go to 300 floors and 400 bays wide."],["v1.043","Three small rooms fill the gaps big rooms leave: a 4-bay small office, an 8-bay studio condo and a 2-bay vending nook. Fixes: night lighting no longer stays on in a blackout; new games and loads start inside instead of in the Outside view; outside you hear the street instead of the rooms; people, dogs and sewage inside rooms no longer show through the walls outside; very large towers no longer slow the Outside view to a crawl; the facade pictures in the Outside panel no longer pile up in memory."],["v1.042","The Outside view is redrawn. Facades have depth: a side wall, shadows that follow the sun, recessed windows, piers, fins and ledges. Glass reflects the sky and drifting clouds; lit windows come in warm, cool and TV-blue with blinds and a night glow. Brick gets stone trim, a cornice, fire escapes and awnings; Art Deco gets limestone piers, bronze panels and finials; every tower gets a proper street entrance. Night lighting traces corners, floors, piers and cornices and washes the crown. The Outside panel shows a picture of each facade, color swatches for the lights and the roof toppers to place, the Outside button lights up while you are outside, and picking a build tool takes you back in."],["v1.041","Architecture: an Outside view (button or O key) shows the tower from the street with six facades, from glass curtain wall to Art Deco limestone and steel diagrid, windows lit by the rooms behind them, and night lighting in six schemes. New for the roof: a spire with an aircraft warning light, an Art Deco crown, a broadcast mast that carriers lease, a helipad with landing helicopters and a roof garden; an observation deck sells tickets on the top floors. Towers go to 200 floors and you can zoom out to see all of it. Every office tenant has its own name. No more street whoosh; the elevator rush is a low rumble. Touches that got lost no longer lock up building and zooming, and an error no longer freezes the game."],["v1.040","Crowds instead of single voices: lobbies, restaurants, offices and parties now carry a murmur of many overlapping voices with the room's echo, rendered once when sound starts. The city is a wash of distant traffic with cars swelling past and a far-off horn. Every sound shares one room echo so it all blends. Elevator chimes are soft, rare and only at normal speed."],["v1.039","Sound rebuilt around one thing at a time: a quiet city ambience, then only the sounds of whatever is in the middle of the screen once you zoom in (an elevator shaft, the lobby, a restaurant, an office, a party, the theater, a building site, the street), plus a few events that matter: alarms, sirens, star ratings, the day's takings. Zoomed out you hear the city, the weather and the events, nothing else."],["v1.038","Elevators are quieter company: the motor whine is gone, a car only rushes past when it moves through the middle of the view, and chimes and doors only sound for cars near the middle, one at a time. Elevators have their own volume slider. Fast forward raises the pitch of everything in the world, more the faster you go."],["v1.037","Sound you can hear: people on screen talk (every speech bubble is said out loud, and someone is always chatting), parties shout and laugh, moving elevators whine and rush with a motor note that climbs with speed, brakes clunk on start and the car thunks level on stop. Whole-tower view is no longer near silent, everything is about 25 dB louder in the speaker range, and iPhones play sound with the silent switch on."],["v1.036","The \u25B6 speed works again: the clock never reached a full second at 1x, so elevators, people and cars all stood still. Cars now pull away at 1.6 m/s\xB2 and brake at 1 m/s\xB2, slowing to about 5 mph for the ramp, the turn and the parking space."],["v1.035","Copyright notice on the title screen, the menu and in the file."],["v1.034","Medical center (3 stars): tenants and walk-ins come in for checkups and the clinic bills them. The 4th star takes a medical center and a VIP inspection: the hotel guide sends an inspector to sleep in a suite, and slow elevators, garbage or a disaster during the stay fail it. Theater: set the ticket price and book next week's genre; attendance up and wages down so it pays back. Trash: add a compactor for double capacity, call an extra pickup for $900, and a new trash room has to keep up for a week before it counts. Effects and ambience faders, soft lobby music. Autosaves pack in the background so the game never stalls."],["v1.033","Sound for everything, all synthesized: elevator chimes (one up, two down), doors and motors, construction, crowds, offices, kitchens, parties, the theater, fire alarms and sirens, police, traffic, rain, wind, thunder, fireworks, birds and crickets, cash at midnight, a fanfare for each star. Trash rooms that fill from every floor and get emptied every Monday. A two-floor movie theater with a new generated movie every Friday, 17 kinds of film, live picture, posters and an audience. Stars now unlock rooms and come mostly from population. The speed buttons always stay on screen, even in the full-screen fallback. Save and quit to title; New tower and Load save the tower you were in first; the menu shows when it last saved. Saves are packed about 12 times smaller so big towers fit in browser storage, and autosave clears old saves if storage still fills up."],["v1.032","Parties draw 20 to 30 guests, and some blow up when word gets out. A party packed past 32 people gets the police called on it sooner or later (three or four officers for a big one). Fire alarms go off on their own now (burnt popcorn, shower steam, grease smoke, vaping, a faulty detector, a party guest at the pull station, and now and then a real kitchen fire): the alarm floor and the floors above and below go down the stairs while elevators keep running for everyone else, and crews come check. A room on fire flashes bright red with a FIRE label, a fire off screen gets a flashing marker on the screen edge, the alarm banner flashes and has a Show button, and the alarm strobes flash brighter. The top bar wraps instead of running off a small screen."],["v1.031","During a fire alarm, dental patients and waiting-room visitors clear out with everyone else instead of staying in the chairs."],["v1.030","Speech bubbles only appear over a person drawn on screen, exactly where that person is drawn. No more bubbles floating over an empty spot for people in rooms off screen or still loading. The You marker follows you into elevators."],["v1.029","Every room has its own look. Condos: ten decorating styles (the unit above, below or beside never matches), a home gym, piano, aquarium or office, a kids' room with bunk beds (kids live there), an art studio or a guest room, and some fireplaces. Offices: seven kinds of tenant, each with its name on the sign: corporate, startup with standing desks and ping-pong, law firm with private offices, trading floor with tickers, design studio, dental office with patients in the chair, call center. Hotels: five decor styles that change every four floors, mirrored rooms, suites with a bar, a dining table or a hot tub. Food courts: burgers, pizza oven, tacos, noodle woks, coffee bar. A new owner or tenant redecorates; units for sale or lease sit empty with a ladder and paint cans. Cars drive on a street in front of the lobby instead of through it. Speech bubbles sit over the person talking."],["v1.028","People rebuilt with jointed arms and legs: they walk at 1.16 m/s, take the stairs on a diagonal (several at once), sit properly on chairs, sofas and stools, sleep under blankets, sit up in bed with the TV, dance at parties, check their phones and carry umbrellas. \u25B6 now runs in real time. Security office with a camera wall and a patrol guard. Tuned mass damper explained and redrawn (cuts sway up to 40%). Four seasons on a 12-day year with St. Louis temperatures, rain, snow on the roof, falling leaves, blossoms, real sunrise and sunset, gas heating and seasonal hotel demand. Holidays: fireworks, Christmas lights, Halloween costumes, Valentine hearts, family visits. Parties galore on weekends and holidays, conga lines, popcorn fire alarms, towel lockouts, fish in the office microwave, a raccoon, elevator button pranks, sleepwalkers in their underwear, and a naked guest swinging from the shower rod in an ice bucket."],["v1.027","Building life: night owls, dog walks, sleepwalkers, 1 am pizza, arguments, parties with noise complaints and police. Sewage backups with spraying drains, flies and a remediation crew in protective suits; grease interceptors; housekeeping shortcut risks OSHA ($16,550 serious, $165,514 repeat). You: walk the tower and do what you like."],["v1.026","Zoomed-out art: glass facades with lit windows at night, sun, moon, stars, clouds, birds, a detailed skyline with blinking antenna lights, street trees, lamps and traffic, soil and limestone layers with utility lines, aviation lights on the roof. Express and service elevators run up to 100 floors."],["v1.025","Build window scrolls by touch again, so every item is reachable."],["v1.023","Basements to B8 with a parking garage: spaces, ramps, cars that drive in and park, valet stand, full-service car wash; residents park free, others pay. Tank and chiller tools show every spot that fits plus dry and hot floors. Water in gallons; fill pump runs from 75% to full."],["v1.022","Real-world economy on a monthly clock (each game day books a month), with HOA dues and a bank loan. Chiller plants (300, 800, 2,000 t) sized for a hottest day. Fire alarm covers 3 floors either side, plus a Full alarm button; strobes; elevators on fire service for wheelchair users, elderly and firefighters; crews ride up and fight the fire. Full food courts send people out for lunch. Damage notices, landscape layout."],["v1.021","Sprinklers (per floor, need water) put fires out in minutes; fires show clearly when zoomed out and the view jumps to them; roof gear is craned up for a flat $5,000; old narrow shafts widen to 2 bays on load."],["v1.020","Build window: a small grid of drawn icons. Disasters: fire (alarm, elevator recall, stair evacuation, crews), hurricane, tornado, earthquake, power outage, flood, with repairs. Smooth elevator and walker motion. Richer room art: wall textures, floors, light pools, shading and more props."],["v1.019","Top bar always sits above info panels so speed buttons stay tappable; satisfaction and review bars show again."],["v1.018","Shafts 2 bays with riders drawn inside; TVs show news, movies, wildlife, sports, cartoons and weather, more TVs; panels sit below the top bar; offices and hotel rooms cheaper; lot is 3\xD7 wider with no edges; floors can be framed over roof tanks and coolers (they get lifted up)."],["v1.017","Elevator shafts are one bay wide; every car rides in that one shaft, stacked (a badge shows when cars share a floor). Old wide shafts shrink on load."],["v1.016","Export and import save files so a tower survives new versions."],["v1.015","Multiple saved towers with a list (load, rename, delete; Save as new). Cars share one fixed-width shaft (8 max, service 4); waiting riders line up beside the doors; walkers easier to see with stride, bob and shadow; lease/sale pop-ups removed; construction hatching no longer slides when you pan."],["v1.014","\u26F6 now hides the top bar and toolbar when real full screen is blocked (inside the Claude app); tap the corner \u26F6 to bring them back."],["v1.013","Full-screen button (\u26F6) in the top bar; opens the game in its own tab where full screen is blocked."],["v1.012","Installs as a home-screen app: icon, full screen, works offline, updates itself when online."],["v1.011","Faster fast-forward (up to 1 hour per second); construction crews and rising steel; people walk in from and out to the street; room life (typing, cooking, eating, TV, laundry, sleeping, wandering); one-tap elevator extension."],["v1.009","Interiors repainted at true scale (2 m beds, real kitchens, baths, living rooms, offices, laundries, restaurants), cached as painted sprites."],["v1.008","Rooms redrawn in detail with every occupant shown sitting, working, eating or sleeping; autosave every 2 minutes, at midnight and whenever you leave or switch away."],["v1.007","Rooftop cooling towers (150, 400, 1,000 tons) against a real heat load; elevator hoistways are fixed width, each car adds its own; shafts span 50 floors max; floor numbers on every shaft; bigger controls and text."],["v1.006","Rooftop water tanks (S, M, L): city pressure stops at floor 6, tanks feed 30 floors below by gravity, fill pumps, run dry when undersized. Wheelchair users and elderly people: no stairs for wheelchairs, wheelchairs take 3 places in a car, elderly walk slower and avoid stairs."],["v1.005","Back to a 2D-only side view; the 3D tower lives on as the separate game Floored."],["v1.004","Fixed elevators locking up when every car in a bank was full."],["v1.003","3D tower view (orbit, pan, pinch) with a 2D toggle; footings removed; Lobby now builds its own floor."],["v1.002","Step-by-step build guide with a flashing target on the lot; every tool now says exactly how to use it; failed builds pop up the reason. New colours: blue offices, green condos, pink hotel rooms, teal housekeeping, orange fast food, plus room labels, For lease/For sale/Dirty signs and a colour key on each tool."],["v1.001","First build: empty lot, footings to caissons, steel frame floors, lobbies and 15 to 30 floor sky lobby rule; offices for rent, condos for sale, hotel singles, twins and suites with housekeeping; fast food; stairs; local, express and service elevators with collective dispatch, door dwell, parking and per-floor stops; wind sway with a mass damper; star ratings; save."]];function ji(t){return t==="bridge"?dt(bo.cost*4)+"/bay":t==="spr"?dt(zs)+"/bay":t==="slab"?dt(bo.cost)+"/bay up":t==="lobby"?dt(B.lobby.cost)+"/bay":B[t]?dt(B[t].cost):qt[t]?dt(qt[t].base+qt[t].car):""}function v0(t){return t==="br li><li>Floor 1 is lobby only. Sky lobbies go 15 to 30 floors above the lobby below.</li><li>Local elevators span 50 floors; express and service shafts run up to 100 (steel ropes top out near 500 m of travel). Express elevators stop only at lobbies, so tall towers need sky lobbies to transfer.</li><li>People score every trip. Long waits sour offices, condos and hotel reviews; unhappy tenants leave and condos get sold back.</li><li>City water reaches floor 6; above that you need roof tanks. Chiller plants on the roof keep rooms cool; size them for a hottest day. Sprinklers stop fires early.</li><li>Money runs on a monthly clock: each game day books a month of rent, HOA dues, wages, upkeep, tax and loan interest. A hotel night or a meal counts as a month of them. Condo sales bring cash up front; the bank lends against what you have built.</li><li>Fire alarms sound 3 floors either side of a fire; Full alarm evacuates everyone. Elevators recall, then run on fire service for wheelchair users, the elderly and firefighters. Crews ride to 2 floors below the fire and climb.</li><li>Hotel rooms need housekeeping before they can be booked again. Service elevators are staff only.</li><li>Wind sways tall, slender towers. Widen the base or hang a tuned mass damper near the top: a 660-ton pendulum, like the one in Taipei 101, that swings against the sway and cuts it up to 40%.</li><li>Dig basements down to B8 with the Floor tool. Parking needs a ramp on every level (the B1 ramp opens to the street) and an elevator or stairs down to it. Condo residents park free; workers, visitors and hotel guests pay. Valets and the car wash earn extra.</li><li>Tank and chiller tools light up every roof spot they fit in green and mark dry or hot floors in red.</li><li>People keep their own hours: night owls stay up, residents walk dogs, couriers bring pizza at 1 am. Parties start on weekend evenings; loud ones after 11 pm get complaints and, eventually, the police.</li><li>Sewage backups close a floor until a remediation crew cleans it. Grease interceptors on food courts prevent the worst clogs. Sending housekeeping instead saves money but brings OSHA: $16,550 per serious violation, $165,514 for a repeat.</li><li>Crime: tenants have affairs, feuds and business partners who rob each other, and now and then it ends in murder. Police tape the room off, neighbors get scared and rentals slow down. Cases are under You: clues come in over time (elevator logs, a security office&#39;s cameras, witnesses, motives). Tip off the police for a reward, but a wrong guess gets you sued for defamation. You can kill too, dump the body down a trash chute or frame a suspect. Witnesses, cameras and detectives can catch you, and an arrest ends the game.</li><li>Tap You to walk the tower yourself: chat with tenants, break up parties, throw your own, plunge a sewer, order pizza, or pull the fire alarm (the city bills $500).</li><li>A security office ($250k, $25k a month) puts a camera operator and a patrol officer on duty. They quiet parties before the police come, talk down odd guests, let locked-out guests back in, chase off raccoons and keep garage break-ins down.</li><li>Each game day is a month: 3 days a season, 12 a year, with St. Louis weather. Winter brings snow and gas heating bills, summer the chiller load and more hotel guests. Sunrise and sunset follow the month. Holidays bring fireworks, lights, costume parties and family visits, and parties run all weekend.</li><li>Stars come mostly from population: 2 stars at 300 people, 3 at 1,000 with a security office, 4 at 2,500 with a hotel suite, a medical center, trash rooms that keep up, satisfaction 55+ and a good review from the VIP inspector who comes to stay a night, 5 at 5,000 with a movie theater (and a damper above 40 floors). Each star unlocks new rooms and raises rents.</li><li>Trash: every floor chutes into basement trash rooms. Residents throw out about 3.5 lb a day, office staff 1.5, hotel guests 2.5, plus meals and movie tickets. A room holds 8 tons and the hauler swaps it every Monday at 6:00. Without one, the city takes 2 tons from the curb; past that, bags pile up, it smells, raccoons come and the health inspector fines you.</li><li>The movie theater is two floors tall. Shows run from matinee to late show, with a morning show at the weekend, and a new generated movie opens every Friday. Most of the audience comes in off the street (so low floors sell better), a quarter from inside the tower.</li><li>Sound: elevators chime once going up and twice going down, doors slide, crowds murmur, parties thump, fire alarms sound the Temporal-3 pattern, sirens, rain and wind. Everything is placed by where it is on screen. Sound and volume are in the menu; M mutes, Space pauses, 1 to 5 set the speed. A party draws 20 to 30 guests; some blow up when word gets out, and a party packed past 32 people gets the police called on it sooner or later.</li><li>\u25B6 runs in real time so you can watch people; \u25B6\u25B6 is normal speed.</li><li>Fire alarms go off on their own: burnt popcorn, shower steam, grease smoke, a faulty detector, a party guest at the pull station, and now and then a real kitchen fire. The alarm floor and the floors above and below go down the stairs; the city bills each false alarm. A room on fire flashes red.</li><li>Every room has its own look: condo owners decorate (and some have kids), each office tenant brings its own business and sign, hotels change decor every four floors, and each food court is a different restaurant. Neighbors never match, a new owner or tenant redecorates, and units for sale or lease sit empty.</li><li>Two fingers pan and pinch. With a build tool, drag to fill a row or a stack.</li></ul><div class="sub" style="margin:4px 0 10px">Highline Tycoon v'+Eo+' \xB7 \xA9 2026 Matt Schulte. All rights reserved.<br>All companies, people, films, brands and places in this game are fictional. Any resemblance to real ones is coincidental.</div><div class="btn
